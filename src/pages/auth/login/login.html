<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Iniciar sesión</title>
    <link rel="stylesheet" href="../../../../styles.css">
</head>

<body class="pagina-auth">
    <main>
        <h1>Food Store</h1>
        <h2>Iniciar sesión</h2>
        <form id="form">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" placeholder="example@example.com" required>
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="********" required>
            </div>
            <button type="submit">Ingresar</button>
            <a href="../registro/registro.html">Registrarse</a>
        </form>
    </main>
    <script type="module" src="./login.ts"></script>
</body>

</html>
